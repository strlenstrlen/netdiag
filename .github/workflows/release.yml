name: Release

# Push a tag like v0.1.0 to build and publish a release. Running it by hand
# (workflow_dispatch) builds the same archives as artifacts without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    # macOS builds need cgo for CoreWLAN (Wi-Fi stats), so they build on a Mac.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build universal binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="0.0.0-${GITHUB_SHA::7}"
          LDFLAGS="-s -w -X github.com/strlenstrlen/netdiag/internal/version.Version=$VERSION"
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -ldflags "$LDFLAGS" -o netdiag-$arch ./cmd/netdiag
          done
          mkdir -p dist pkg
          lipo -create -output pkg/netdiag netdiag-arm64 netdiag-amd64
          cp README.md LICENSE pkg/
          ./pkg/netdiag --version
          tar -czf "dist/netdiag_${VERSION}_macos_universal.tar.gz" -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*

  others:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build Linux and Windows binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="0.0.0-${GITHUB_SHA::7}"
          LDFLAGS="-s -w -X github.com/strlenstrlen/netdiag/internal/version.Version=$VERSION"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            rm -rf pkg && mkdir pkg
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$LDFLAGS" -o "pkg/netdiag$ext" ./cmd/netdiag
            cp README.md LICENSE pkg/
            name="netdiag_${VERSION}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd pkg && zip -q "../dist/$name.zip" ./*)
            else
              tar -czf "dist/$name.tar.gz" -C pkg .
            fi
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-others
          path: dist/*

  publish:
    needs: [macos, others]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt && cat checksums.txt
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: release-preview
          path: dist/*
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "netdiag $GITHUB_REF_NAME" \
            --generate-notes
